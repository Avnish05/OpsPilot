spring:
  application:
    name: opspilot

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/opspilot}
    username: ${DB_USERNAME:opspilot}
    password: ${DB_PASSWORD:opspilot_local_password}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always